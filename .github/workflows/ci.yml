name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.5
      - run: ruff check src analysis tests

  test:
    # The suite runs on hand-built fixtures and the committed results/findings.json,
    # so CI never needs the 89MB dataset. Three versions because the floors declared
    # in pyproject.toml should be true, not aspirational.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  pinned:
    # The exact environment results/findings.json was produced with. If a pinned
    # dependency stops installing, the study stops being reproducible, and that should
    # break the build rather than be discovered years later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest
